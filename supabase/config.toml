  [functions.push-dispatch]
    # Drained by pg_cron with the vault-stored service_role key.
    # On sb_secret_... (non-JWT) key projects, verify_jwt=true rejects
    # the cron call at the gateway before requireAuth runs. requireAuth
    # inside still enforces isServiceRole (anon -> 403), so auth is not weakened.
    verify_jwt = false
  [functions.record-appointment-outcome]
    # Project uses asymmetric JWT signing keys; gateway verify_jwt rejects
    # valid user tokens with UNAUTHORIZED_ASYMMETRIC_JWT before the function
    # boots. The function validates the Bearer token and the caller's role
    # itself, so auth is not weakened.
    verify_jwt = false
