name: Major Intelligence link check

on:
  pull_request:
    paths:
      - 'src/data/intel/**'
      - 'src/components/team/intel/**'
  push:
    paths:
      - 'src/data/intel/**'
      - 'src/components/team/intel/**'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vitest run src/data/intel/majorIntel.links.test.ts
