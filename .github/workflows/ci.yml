name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom@30 (test env) requires Node ^22.22.2 || ^24.15.0 || >=26.0.0:
          # its undici@8 dependency uses node:worker_threads markAsUncloneable,
          # which does not exist on Node 20.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint currently carries 800+ pre-existing violations (mostly `any` in
      # Deno edge functions). Surfaced but not blocking until that debt is paid.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Verify Lovable Cloud build binding
        run: |
          grep -R -q "mzbadxfvxioedzdjxamc.supabase.co" dist/assets || {
            echo "::error::The production bundle is missing the Lovable Cloud endpoint."
            exit 1
          }
          if grep -R -q "Supabase client could not be initialized" dist/assets; then
            echo "::error::The production bundle still contains the obsolete startup blocker."
            exit 1
          fi

