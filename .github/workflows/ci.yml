name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom@30 (test env) requires Node ^22.22.2 || ^24.15.0 || >=26.0.0:
          # its undici@8 dependency uses node:worker_threads markAsUncloneable,
          # which does not exist on Node 20.
          node-version: 22
          cache: npm

      # bun.lock is the dev lockfile (see bunfig.toml); package-lock.json is the
      # committed npm lockfile CI installs from. --legacy-peer-deps matches the
      # tolerance bun applies, needed for pre-existing peer mismatches:
      # next-themes@0.3.0 peers React <=18 (project uses React 19) and
      # @typescript-eslint/eslint-plugin@6 peers ESLint <=8 (project uses 9).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Lint currently carries 800+ pre-existing violations (mostly `any` in
      # Deno edge functions). Surfaced but not blocking until that debt is paid.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Verify Lovable Cloud build binding
        run: |
          # The nitro/Cloudflare build emits to .output/public, not dist.
          BUNDLE_DIR=.output/public/assets
          grep -R -q "mzbadxfvxioedzdjxamc.supabase.co" "$BUNDLE_DIR" || {
            echo "::error::The production bundle is missing the Lovable Cloud endpoint."
            exit 1
          }
          if grep -R -q "Supabase client could not be initialized" "$BUNDLE_DIR"; then
            echo "::error::The production bundle still contains the obsolete startup blocker."
            exit 1
          fi

