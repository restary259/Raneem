name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint currently carries 800+ pre-existing violations (mostly `any` in
      # Deno edge functions). Surfaced but not blocking until that debt is paid.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      # Production build vars live in Vercel/Lovable. Mirror them into GitHub
      # repo secrets so CI can catch a missing one before a broken bundle ships.
      # Enforcing on push to main; advisory on pull requests.
      - name: Preflight - required build env vars
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          ENFORCE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          missing=()
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All required build env vars are present."
            exit 0
          fi
          msg="Missing required build env var(s): ${missing[*]}. Configure them in Vercel/Lovable build environment variables and mirror them into GitHub repository secrets."
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg"

      - name: Typecheck and build
        run: npm run build

